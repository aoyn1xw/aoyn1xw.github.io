name = "portfolio-commissions"
main = "src/index.js"
compatibility_date = "2026-08-23"
preview_urls = false

[observability]
enabled = false

[vars]
# Comma-separated list of browser origins allowed to call this worker.
# Add or remove origins here as needed (e.g. your local dev server).
ALLOWED_ORIGINS = "https://aoyn1xw.github.io,http://localhost:3000,http://127.0.0.1:3000"

# Production rate limiting: five submissions per source IP per minute in each
# Cloudflare location. Keep the namespace ID unique within your account.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

# Secrets are NOT defined here.
# Configure them with:
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID
